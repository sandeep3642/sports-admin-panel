<div>
  <div *ngIf="visible" class="flex justify-center items-center mb-4 cursor-pointer shadow rounded w-fit px-2 py-2" (click)="toggleDisplay()">
    <img src="../../../../../assets/icons/go-back.svg" class="mr-1" />
    <p class="">Go Back</p>
  </div>
  <div class="flex items-center justify-between mb-4" *ngIf="!visible">
    <!-- Left Side: Header -->
    <app-nft-header [title]="'Sports Infrastructure Management Portal'"></app-nft-header>
    <app-button impact="bold" shape="rounded" tone="primary" size="medium" fit class="white-nowrap" (click)="goToAddVenue()" *ngIf="!showActions;">
      <img src="../../../../../assets/usermanagement/add_24dp_E3E3E3_FILL1_wght400_GRAD0_opsz24 1.svg" class="px-1">Add New Venue
    </app-button>
  </div>
</div>





<div class="mt-3 ">
  <app-cards [countsData]="analyticsdata"></app-cards>
  <app-venue-facilities-card (filterChanged)="onFilterUpdate($event)" [months]="months" *ngIf="!showActions && (facilities_per_sports?.length > 0 || booking_by_user_type?.length > 0)" [facilities_per_sports]="facilities_per_sports" [booking_by_user_type]="booking_by_user_type">
  </app-venue-facilities-card>
</div>

<div class="">
  <app-venue-analytics-district-card *ngIf="!showActions" [feedback]="feedback" [topRatedFacilities]="topRatedFacilities" [districts]="districts" [sports]="sports" (filterChanged)="onFilterUpdate($event)">
  </app-venue-analytics-district-card>
</div>

<div class="mt-3">
  <app-venue-facility-booking-card *ngIf="!showActions" [facility_booking_rates]="facility_booking_rates" [sports]="sports" (filterChanged)="onFilterUpdate($event)">
  </app-venue-facility-booking-card>
</div>

<div class="mt-3">
  <app-venue-list [showActions]="showActions" (viewAllClicked)="onViewAllClicked()"></app-venue-list>
</div>
