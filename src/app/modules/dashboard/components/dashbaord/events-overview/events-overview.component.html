<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
    <!-- Header Section -->
    <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-orange-500 rounded-lg flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                    </path>
                </svg>
            </div>
            <h2 class="text-xl font-semibold text-gray-900">Total Events Overview</h2>
        </div>

        <!-- Time Selector -->
        <div class="relative">
            <select [(ngModel)]="pieChartFilter.time_period"
                (ngModelChange)="onPieChartFilterChange($event,'time_period')"
                class="border border-gray-300 cursor-pointer rounded-md text-gray-900 text-sm py-1.5 px-3 pe-8 focus:outline-none focus:ring-1 focus:ring-blue-600 focus:border-blue-600">
                <option value="" disabled selected>-- Select Time Period --</option>
                <option *ngFor="let month of months" [value]="month.value">
                    {{ month.label }}
                </option>
            </select>
            <svg class="absolute right-2 top-1/2 transform -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none"
                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </div>
    </div>

    <!-- Chart Container -->
    <div class="relative">
        <!-- Chart -->
        <div class="chart-container">
            <apx-chart #chart [series]="chartOptions.series!" [chart]="chartOptions.chart!"
                [xaxis]="chartOptions.xaxis!" [yaxis]="chartOptions.yaxis!" [stroke]="chartOptions.stroke!"
                [markers]="chartOptions.markers!" [legend]="chartOptions.legend!" [colors]="chartOptions.colors!"
                [tooltip]="chartOptions.tooltip!" [dataLabels]="chartOptions.dataLabels!">
            </apx-chart>
        </div>

        <!-- Floating Info Card -->

    </div>

    <!-- Bottom Summary -->
    <div class="mt-6 pt-4 border-t border-gray-100">
        <p class="text-sm text-gray-600">
            Total events increased by <span class="font-semibold text-gray-900">{{ totalGrowthPercentage }}%</span> over
            the past 6 years
        </p>
    </div>
</div>
