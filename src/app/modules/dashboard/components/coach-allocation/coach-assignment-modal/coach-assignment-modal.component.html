<!-- Modal Backdrop -->
<div *ngIf="isOpen" class="fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center z-50" (click)="onClose()">
  <!-- Modal Content -->
  <div class="bg-white rounded-lg shadow-xl w-[450px] h-[525px] border border-gray-200 relative" (click)="onModalClick($event)">
    <!-- Modal Header -->
    <div class="flex justify-between items-center p-6 border-b border-gray-200">
      <h2 class="text-xl font-semibold text-gray-900">Coach Allocation Requests</h2>
      <button (click)="onClose()" class="text-gray-400 hover:text-gray-600">
        <svg-icon src="assets/icons/heroicons/outline/x-mark.svg" [svgClass]="'h-6 w-6'"></svg-icon>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="p-6 space-y-6">
      <!-- User Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">User Name</label>
        <input 
          type="text" 
          [value]="user?.full_name || ''" 
          readonly
          class="w-full px-3 py-2 border border-gray-300 rounded-md bg-gray-50 text-gray-900"
        >
      </div>

      <!-- Date -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Date</label>
        <div class="relative">
          <input 
            type="date" 
            [(ngModel)]="formData.date"
            class="w-full px-3 py-2 pr-10 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          >
          <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
            <svg-icon src="assets/icons/heroicons/outline/calendar.svg" [svgClass]="'h-5 w-5 text-gray-400'"></svg-icon>
          </div>
        </div>
      </div>

      <!-- Sports Category Dropdown -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Select Sports Category</label>
        <div class="relative">
          <button 
            type="button"
            (click)="sportsDropdownOpen = !sportsDropdownOpen; $event.stopPropagation()"
            class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white text-left focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 flex justify-between items-center"
          >
            <span class="text-gray-900">
              {{ selectedSport ? 'Sports Category: ' + selectedSport.name : 'Select Sports Category' }}
            </span>
            <svg-icon src="assets/icons/heroicons/outline/chevron-down.svg" [svgClass]="'h-5 w-5 text-gray-400'"></svg-icon>
          </button>
          
          <!-- Dropdown Menu -->
          <div *ngIf="sportsDropdownOpen" class="absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg max-h-60 overflow-auto">
            <div 
              *ngFor="let sport of sportsCategories"
              (click)="onSportChange(sport); sportsDropdownOpen = false"
              class="px-3 py-2 hover:bg-gray-100 cursor-pointer text-gray-900"
            >
              {{ sport.name }}
            </div>
          </div>
        </div>
      </div>

      <!-- Coach Dropdown -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Coach</label>
        <div class="relative">
          <button 
            type="button"
            (click)="coachesDropdownOpen = !coachesDropdownOpen; $event.stopPropagation()"
            class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white text-left focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 flex justify-between items-center"
          >
            <span class="text-gray-900">
              {{ selectedCoach ? 'Coach: ' + selectedCoach.name : 'Select Coach' }}
            </span>
            <svg-icon src="assets/icons/heroicons/outline/chevron-down.svg" [svgClass]="'h-5 w-5 text-gray-400'"></svg-icon>
          </button>
          
          <!-- Dropdown Menu -->
          <div *ngIf="coachesDropdownOpen" class="absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg max-h-60 overflow-auto">
            <div 
              *ngFor="let coach of coaches"
              (click)="onCoachChange(coach); coachesDropdownOpen = false"
              class="px-3 py-2 hover:bg-gray-100 cursor-pointer text-gray-900"
            >
              {{ coach.name }}
            </div>
          </div>
        </div>
      </div>

      <!-- Remarks -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Remarks</label>
        <textarea 
          [(ngModel)]="formData.remarks"
          rows="4"
          placeholder="Enter remarks here..."
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-none"
        ></textarea>
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="absolute bottom-0 left-0 right-0 p-6 border-t border-gray-200">
      <div class="flex justify-end">
        <app-button 
          impact="bold" 
          shape="rounded" 
          tone="primary" 
          size="medium"
          (click)="onSubmit()"
          class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2"
        >
          Assign
        </app-button>
      </div>
    </div>
  </div>
</div>
