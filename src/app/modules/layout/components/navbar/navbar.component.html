<div class="bg-background relative border-b-1 border-dashed border-[#D5D5D5]">
  <div class="mx-auto px-5">
    <div class="flex items-center justify-between py-3.5 md:justify-start">
      <!-- Mobile Navigation Menu Button-->
      <div class="sm:order-1 md:hidden">
        <button
          (click)="toggleMobileMenu()"
          type="button"
          class="bg-muted text-muted-foreground focus:ring-primary hover:bg-muted-foreground hover:text-muted inline-flex items-center justify-center rounded-md p-2 focus:outline-hidden focus:ring-2 focus:ring-inset"
          aria-expanded="false">
          <span class="sr-only">Open menu</span>
          <!-- Heroicon name: outline/menu -->
          <svg-icon src="assets/icons/heroicons/outline/menu.svg" [svgClass]="'h-6 w-6'"> </svg-icon>
        </button>
      </div>

      <!-- Logo -->
      <div class="flex items-center justify-start gap-3 sm:order-2 ltr:md:mr-10 rtl:md:ml-10 lg:hidden">
        <a class="bg-primary flex items-center justify-center rounded-sm p-2 focus:outline-hidden focus:ring-1">
          <svg-icon src="assets/icons/logo.svg"></svg-icon>
        </a>
        <b class="text-foreground hidden text-sm font-bold sm:block"> Sports App</b>
      </div>

      <!-- Desktop Menu -->
      <div class="hidden space-x-3 sm:order-3 md:flex items-center">
        <button
        (click)="toggleSidebar()"
        class="flex items-center justify-center rounded-md p-2 transition-all duration-200 shadow-sm bg-white"
        [ngClass]="{ 'rotate-180': !menuService.showSideBar }">
        <svg-icon src="../assets/icons/sidebar-ico.svg"> </svg-icon>
      </button>

        <!-- <app-navbar-menu></app-navbar-menu> -->
         <!-- <h2 class="text-lg font-semibold text-black">Stakeholder Management</h2> -->
         <div *ngIf="!showBack; else backTpl" class="flex items-center">
           <h2 class="text-lg font-semibold text-black" *ngIf="currentTitle">{{ currentTitle }}</h2>
         </div>
         <ng-template #backTpl>
           <div class="flex justify-center items-center mb-0 cursor-pointer shadow rounded w-fit px-2 py-2" (click)="goBack()">
             <img src="../assets/icons/go-back.svg" class="mr-1" />
             <p class="">Go Back</p>
           </div>
         </ng-template>
         <svg-icon  src="../assets/icons/qico.svg"></svg-icon>
      </div>

      <!-- Profile menu -->
      <div class="items-center justify-end sm:order-10 md:flex md:flex-1 lg:w-0 gap-4">
        <div class="hidden md:flex ml-auto items-center gap-3">
          <div class="bg-white rounded-2xl shadow px-4 py-2 items-center gap-6 border border-gray-100">
            <div class="flex align-items-center gap-3 font-medium">
              <span class="inline-flex items-center justify-center rounded-md bg-[#F5F5F5] px-2 py-1 text-xs font-semibold text-[#075FB0] border border-[#075FB0]">{{ daysInMonth }}</span>
              <span class="text-base font-14px">{{ currentDateDisplay }}</span>
              <div class="text-base font-14px">{{ currentTimeDisplay }}</div>
            </div>
          </div>
        </div>
        <div class="flex items-center">
          <app-profile-menu></app-profile-menu>
        </div>
      </div>
    </div>
  </div>
  <!-- Mobile menu -->
  <app-navbar-mobile></app-navbar-mobile>
</div>
